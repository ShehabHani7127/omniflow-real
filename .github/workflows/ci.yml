# Continuous integration: on every push, a clean machine installs the locked
# environment and runs the linter, the tests and the M0 smoke test.
#
# Three operating systems are tested because SUMO ships a different binary for
# each one. If it passes here, it should also work on a fresh clone at home.
name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.11" } # oldest supported Python
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}

      - name: Install exactly the locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run the tests
        run: uv run pytest

      - name: Run the M0 smoke test
        run: uv run python scripts/m0_smoke_test.py
